name: jar-build
on:
  push:
    tags:
      - 'jar-263b'
permissions:
  contents: write
jobs:
  jar:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: publish jar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls build/libs/realistic-snow-physics-*.jar | grep -v -e '-sources.jar' -e '-dev.jar' | head -1)
          gh release create jar-263b "$JAR" --title "jar 26.3 dedup build" --notes "test jar" || gh release upload jar-263b "$JAR" --clobber
