name: jar-build
on:
  push:
    tags:
      - 'jar-263o'
permissions:
  contents: write
jobs:
  jar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with: {java-version: '25', distribution: 'microsoft'}
      - run: chmod +x ./gradlew
      - run: ./gradlew build
      - env: {GH_TOKEN: ${{ github.token }}}
        run: |
          JAR=$(ls build/libs/realistic-snow-physics-*.jar | grep -v -e '-sources.jar' -e '-dev.jar' | head -1)
          gh release create jar-263o "$JAR" --title "jar scan build" --notes "test jar" || gh release upload jar-263o "$JAR" --clobber
