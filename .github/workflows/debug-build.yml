name: debug-build
on:
  push:
    tags:
      - 'debug-1211b'
permissions:
  contents: write
jobs:
  debug:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build with log
        run: ./gradlew build --stacktrace > build.log 2>&1; echo "exit=$?" >> build.log; tail -200 build.log || true
      - name: publish log
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view debug-1211b >/dev/null 2>&1; then gh release upload debug-1211b build.log --clobber; else gh release create debug-1211b build.log --title "debug 1.21 build log" --notes "debug"; fi
