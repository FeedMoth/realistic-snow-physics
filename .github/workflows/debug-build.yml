name: debug-build
on:
  push:
    tags:
      - 'debug-263i'
permissions:
  contents: write
jobs:
  debug:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build --stacktrace > build.log 2>&1 || true
      - name: publish log
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create debug-263i build.log --title "debug 26.3 plant build" --notes "log" || gh release upload debug-263i build.log --clobber
