name: cleanup
on:
  push:
    tags:
      - 'cleanup-debug2'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: delete debug releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete debug-263c --yes --cleanup-tag || true
          gh release delete debug-263d --yes --cleanup-tag || true
          gh release delete debug-263b --yes --cleanup-tag || true
