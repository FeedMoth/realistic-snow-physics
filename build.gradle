plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
}

loom {
	mods {
		"realistic-snow-physics" {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

// Jar names include the Minecraft version, so a jar is never ambiguous:
// realistic-snow-physics-1.0.0+26.3.jar is for 26.3.
// configureEach, not named: Loom creates remapJar lazily, and
// asking for it by name at evaluation time fails the build.
tasks.withType(Jar).configureEach {
	if (name == "jar" || name == "remapJar") {
		archiveFileName = "realistic-snow-physics-${project.version}+${project.minecraft_version}.jar"
	}
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	repositories {
	}
}
